<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Keepers Archive</title>
<style>
body{margin:0;background:#000;color:#33ff66;font:20px "Courier New",monospace;overflow:hidden}
#crt{padding:30px;height:100vh;box-sizing:border-box;position:relative}
#crt:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03)0,rgba(255,255,255,.03)2px,transparent 2px,transparent 4px);pointer-events:none}
#out{white-space:pre-wrap}
.hidden{display:none}
input{background:#000;border:none;color:#33ff66;font:inherit;outline:none;width:220px}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style></head>
<body><div id="crt"><div id="out"></div><div id="term" class="hidden">
<div>C:\KEEPERS\ARCHIVE&gt; <input id="pw" autocomplete="off"></div>
<div id="msg"></div></div></div>
<script>
const lines=[
"KEEPER OPERATING SYSTEM v1.13",
"(C) 777 THE KEEPERS","",
"Memory Check.............OK",
"Archive Database.........FOUND",
"Echo Registry............CORRUPTED",
"Recovery Service.........ONLINE","",
"WARNING:",
"ECHO 001 STATUS UNKNOWN","","Press any key to continue..."
];
let i=0,o=document.getElementById("out");
function typeLine(){
 if(i<lines.length){o.textContent+=lines[i++]+"\n";setTimeout(typeLine,350);}
}
typeLine();
let ready=false;
setTimeout(()=>ready=true,lines.length*350+100);
document.addEventListener("keydown",e=>{
 if(ready && !document.getElementById("term").classList.contains("shown")){
   o.textContent+="\nARCHIVE OFFLINE — AUTHORIZATION REQUIRED\n";
   document.getElementById("term").className="shown";
   document.getElementById("pw").focus();
 }
});
pw.onkeydown=e=>{
 if(e.key==="Enter"){
  if(pw.value.trim().toUpperCase()==="K-113"){
    msg.textContent="AUTHORIZATION ACCEPTED... RECOVERING ECHO 001...";
    setTimeout(()=>location.href="chapters/chapter1.html",1800);
  } else msg.textContent="ERROR 403 - INVALID AUTHORIZATION";
 }
}
</script></body></html>
